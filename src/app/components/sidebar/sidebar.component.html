<mat-drawer-container class="sidebar-container" autosize>
    <mat-drawer #drawer [ngClass]="{'hidden': isSidebarHidden}" class="sidebar px-13 pt-7 shadow-lg" mode="side" opened>
        <div class="flex items-baseline"><h1 class="mr-5 text-xl font-semibold">{{selectedTitle}}</h1></div>
        <p class="text-sm barritainferior pb-5 pt-2">Practica {{selectedPractice}} - Unidad {{selectedUnit}}</p>
        <p class="my-5 barritainferior pb-5"><span class="font-semibold">Objetivo. </span>{{selectedObjective}}</p>
        <p>{{selectedDescription}}</p>
    </mat-drawer>
</mat-drawer-container>
